<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="TryHackMe Writeups - methodology notes covering enumeration, exploitation and privilege escalation">
<title>TryHackMe Writeups</title>
<defs>
  <linearGradient id="rt-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070e15"/><stop offset="1" stop-color="#04080d"/>
  </linearGradient>
  <radialGradient id="rt-glow" cx="80%" cy="52%" r="55%">
    <stop offset="0" stop-color="#00ff9f" stop-opacity="0.13"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rt-sweep" gradientUnits="userSpaceOnUse" x1="33" y1="-57" x2="66" y2="0">
    <stop offset="0" stop-color="#00ff9f" stop-opacity="0"/>
    <stop offset="1" stop-color="#00ff9f" stop-opacity="0.55"/>
  </linearGradient>
  <pattern id="rt-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#0a1520" stroke-width="1" fill="none"/>
  </pattern>
  <filter id="rt-g" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .m{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
    .d{font-size:11px;fill:#8399a8}
    .chip{font-size:9px;letter-spacing:1.1px;fill:#7fd8b6}
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#rt-bg)" stroke="#16304a"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#rt-grid)" opacity="0.5"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#rt-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#00ff9f" opacity="0.75"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#06231a" stroke="#1d6b4e"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#00ff9f" text-anchor="middle">03</text>
  <circle cx="72" cy="29" r="3.5" fill="#00ff9f"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#3f7d6a">METHODOLOGY &#183; LABS</text>

  <text x="24" y="72" font-size="26" font-weight="700" letter-spacing="1.4" fill="#eafff6">THM WRITEUPS</text>
  <text x="24" y="93" font-size="10" letter-spacing="2.3" fill="#00ff9f">ENUMERATE &#183; EXPLOIT &#183; PRIVESC</text>
  <path d="M24 104 H352" stroke="#14324a"/>

  <text class="d" x="24" y="124">TryHackMe room writeups, recon to root &#8212;</text>
  <text class="d" x="24" y="141">the thought process, not just the flags.</text>
  <text class="d" x="24" y="158">Web, network, Linux and Windows boxes with</text>
  <text class="d" x="24" y="175">lessons learned and tools used on each one.</text>

  <g>
    <rect x="24" y="196" width="41" height="17" rx="3.5" fill="#06231a" stroke="#17513c"/><text class="chip" x="44.5" y="208" text-anchor="middle">NMAP</text>
    <rect x="71" y="196" width="41" height="17" rx="3.5" fill="#06231a" stroke="#17513c"/><text class="chip" x="91.5" y="208" text-anchor="middle">BURP</text>
    <rect x="118" y="196" width="78" height="17" rx="3.5" fill="#06231a" stroke="#17513c"/><text class="chip" x="157" y="208" text-anchor="middle">METASPLOIT</text>
    <rect x="202" y="196" width="59" height="17" rx="3.5" fill="#06231a" stroke="#17513c"/><text class="chip" x="231.5" y="208" text-anchor="middle">LINPEAS</text>
    <rect x="267" y="196" width="66" height="17" rx="3.5" fill="#06231a" stroke="#17513c"/><text class="chip" x="300" y="208" text-anchor="middle">GTFOBINS</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#2f6b56" text-anchor="end">github.com/ShankarAdhikary/Try-Hack-Me-Writeup</text>
</g>

<!-- radar -->
<g transform="translate(466,128)">
  <circle r="66" fill="#04120d" stroke="#15503c"/>
  <g fill="none" stroke="#15503c" opacity="0.75">
    <circle r="22"/><circle r="44"/>
    <path d="M-66 0 H66 M0 -66 V66"/>
  </g>
  <g stroke="#1d6b4e" stroke-width="1.4">
    <path d="M0 -66 v6"/><path d="M0 66 v-6"/><path d="M-66 0 h6"/><path d="M66 0 h-6"/>
    <path d="M46.7 -46.7 l-4.2 4.2"/><path d="M-46.7 46.7 l4.2 -4.2"/>
    <path d="M46.7 46.7 l-4.2 -4.2"/><path d="M-46.7 -46.7 l4.2 4.2"/>
  </g>

  <g>
    <path d="M0 0 L33 -57.2 A66 66 0 0 1 66 0 Z" fill="url(#rt-sweep)"/>
    <path d="M0 0 L66 0" stroke="#7cffd4" stroke-width="1.4" opacity="0.9"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/>
  </g>

  <g fill="#7cffd4" filter="url(#rt-g)">
    <circle cx="52" cy="34" r="2.8" opacity="0.1"><animate attributeName="opacity" values="0.1;1;0.3;0.1" keyTimes="0;0.092;0.20;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="60" r="2.4" opacity="0.1"><animate attributeName="opacity" values="0.1;1;0.3;0.1" keyTimes="0;0.224;0.33;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="-44" cy="26" r="3.1" opacity="0.1"><animate attributeName="opacity" values="0.1;1;0.3;0.1" keyTimes="0;0.415;0.52;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="-20" cy="-50" r="2.6" opacity="0.1"><animate attributeName="opacity" values="0.1;1;0.3;0.1" keyTimes="0;0.689;0.79;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="-18" r="3.4" fill="#ff2e5b" opacity="0.1"><animate attributeName="opacity" values="0.1;1;0.35;0.1" keyTimes="0;0.914;0.99;1" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <circle r="3" fill="#00ff9f"/>
</g>
</svg>
