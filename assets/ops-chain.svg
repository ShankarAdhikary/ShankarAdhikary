    </g>
    <line x1="1064" y1="53" x2="1090" y2="53" stroke="#00ff9f" stroke-opacity="0.6" marker-end="url(#arrow)"/>

    <g transform="translate(1092,30)">
      <rect width="98" height="46" rx="6" fill="#0a0f16" stroke="#00ff9f" stroke-opacity="0.5"/>
      <text x="49" y="28" text-anchor="middle" font-size="12">ITERATE</text>
