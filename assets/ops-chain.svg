    </marker>
  </defs>
  <!-- boxes -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#00ff9f">
    <!-- 8 stages, box width ~130, gap ~18 -->
    <g transform="translate(10,30)">
      <rect width="128" height="46" rx="6" fill="#0a0f16" stroke="#00ff9f" stroke-opacity="0.5"/>
      <text x="64" y="28" text-anchor="middle">LEARN</text>
    </g>
    <line x1="138" y1="53" x2="164" y2="53" stroke="#00ff9f" stroke-opacity="0.6" marker-end="url(#arrow)"/>

    <g transform="translate(166,30)">
      <rect width="128" height="46" rx="6" fill="#0a0f16" stroke="#00ff9f" stroke-opacity="0.5"/>
      <text x="64" y="28" text-anchor="middle">SCOPE</text>
    </g>
    <line x1="294" y1="53" x2="320" y2="53" stroke="#00ff9f" stroke-opacity="0.6" marker-end="url(#arrow)"/>

    <g transform="translate(322,30)">
      <rect width="128" height="46" rx="6" fill="#0a0f16" stroke="#00ff9f" stroke-opacity="0.5"/>
      <text x="64" y="28" text-anchor="middle">BUILD</text>
    </g>
    <line x1="450" y1="53" x2="476" y2="53" stroke="#00ff9f" stroke-opacity="0.6" marker-end="url(#arrow)"/>

    <g transform="translate(478,30)">
      <rect width="128" height="46" rx="6" fill="#0a0f16" stroke="#00ff9f" stroke-opacity="0.5"/>
      <text x="64" y="28" text-anchor="middle">TEST</text>
    </g>
    <line x1="606" y1="53" x2="632" y2="53" stroke="#00ff9f" stroke-opacity="0.6" marker-end="url(#arrow)"/>

    <g transform="translate(634,30)">
      <rect width="128" height="46" rx="6" fill="#0a0f16" stroke="#00ff9f" stroke-opacity="0.5"/>
      <text x="64" y="28" text-anchor="middle">SECURE</text>
    </g>
    <line x1="762" y1="53" x2="788" y2="53" stroke="#00ff9f" stroke-opacity="0.6" marker-end="url(#arrow)"/>

