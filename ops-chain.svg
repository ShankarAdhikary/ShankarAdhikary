<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 178" width="1200" height="178" role="img" aria-label="Workflow: learn, scope, build, test, secure, document, ship, iterate">
<title>workflow pipeline</title>

<defs>
  <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#060c13"/><stop offset="1" stop-color="#03070c"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff9f" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#7cffd4" stop-opacity="1"/>
    <stop offset="1" stop-color="#00ff9f" stop-opacity="0"/>
  </linearGradient>
  <pattern id="pgrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0 V30 M0 30 H30" stroke="#0a1720" stroke-width="1" fill="none"/>
  </pattern>
  <filter id="pglow" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <path id="hexP" d="M24 0 L12 20.8 L-12 20.8 L-24 0 L-12 -20.8 L12 -20.8 Z"/>
  <g id="hexDim"><use href="#hexP" fill="#071019" stroke="#1c4738" stroke-width="1.6"/></g>
  <g id="hexLit" filter="url(#pglow)"><use href="#hexP" fill="#06231a" stroke="#00ff9f" stroke-width="2"/></g>

  <style>
    .m{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
  </style>
</defs>

<rect width="1200" height="178" rx="10" fill="url(#pbg)" stroke="#132433"/>
<rect width="1200" height="178" rx="10" fill="url(#pgrid)" opacity="0.55"/>

<!-- rail -->
<path d="M100 70 H1100" stroke="#14372c" stroke-width="2"/>
<path d="M100 70 H1100" stroke="url(#flow)" stroke-width="2.6" stroke-dasharray="130 1000" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" values="1130;0" dur="8s" repeatCount="indefinite"/>
</path>

<!-- traveling packet -->
<circle cy="70" r="5" fill="#d6fff0" filter="url(#pglow)">
  <animate attributeName="cx" values="100;1100" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- nodes -->
<g class="m">
  <g transform="translate(100,70)"><use href="#hexDim"/></g>
  <g transform="translate(243,70)"><use href="#hexDim"/></g>
  <g transform="translate(386,70)"><use href="#hexDim"/></g>
  <g transform="translate(529,70)"><use href="#hexDim"/></g>
  <g transform="translate(671,70)"><use href="#hexDim"/></g>
  <g transform="translate(814,70)"><use href="#hexDim"/></g>
  <g transform="translate(957,70)"><use href="#hexDim"/></g>
  <g transform="translate(1100,70)"><use href="#hexDim"/></g>

  <g transform="translate(100,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.012;0.085;0.105;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(243,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.137;0.210;0.230;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(386,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.262;0.335;0.355;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(529,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.387;0.460;0.480;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(671,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.512;0.585;0.605;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(814,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.625;0.637;0.710;0.730;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(957,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.762;0.835;0.855;1" dur="8s" repeatCount="indefinite"/></g>
  <g transform="translate(1100,70)" opacity="0"><use href="#hexLit"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.875;0.887;0.960;0.980;1" dur="8s" repeatCount="indefinite"/></g>

  <g font-size="11.5" font-weight="700" text-anchor="middle" fill="#5c8f7e">
    <text x="100" y="75">01</text><text x="243" y="75">02</text><text x="386" y="75">03</text><text x="529" y="75">04</text>
    <text x="671" y="75">05</text><text x="814" y="75">06</text><text x="957" y="75">07</text><text x="1100" y="75">08</text>
  </g>

  <g font-size="11" letter-spacing="1.7" text-anchor="middle" fill="#4e7d6d">
    <text x="100" y="122">LEARN</text><text x="243" y="122">SCOPE</text><text x="386" y="122">BUILD</text><text x="529" y="122">TEST</text>
    <text x="671" y="122">SECURE</text><text x="814" y="122">DOCUMENT</text><text x="957" y="122">SHIP</text><text x="1100" y="122">ITERATE</text>
  </g>
  <g font-size="11" letter-spacing="1.7" text-anchor="middle" fill="#00ff9f" opacity="0">
    <text x="100" y="122">LEARN<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.012;0.085;0.105;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <g font-size="11" letter-spacing="1.7" text-anchor="middle" fill="#00ff9f">
    <text x="243" y="122" opacity="0">SCOPE<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.137;0.210;0.230;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="386" y="122" opacity="0">BUILD<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.262;0.335;0.355;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="529" y="122" opacity="0">TEST<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.375;0.387;0.460;0.480;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="671" y="122" opacity="0">SECURE<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.512;0.585;0.605;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="814" y="122" opacity="0">DOCUMENT<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.625;0.637;0.710;0.730;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="957" y="122" opacity="0">SHIP<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.762;0.835;0.855;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="1100" y="122" opacity="0">ITERATE<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.875;0.887;0.960;0.980;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
</g>

<path d="M40 152 H1160" stroke="#0f2a22"/>
<text class="m" x="600" y="169" font-size="10.5" letter-spacing="2.8" text-anchor="middle" fill="#37604f">
  AUTHORIZED LABS ONLY &#160;&#183;&#160; TEST AGAINST REAL INPUTS &#160;&#183;&#160; DOCUMENT EVERYTHING
</text>
</svg>
